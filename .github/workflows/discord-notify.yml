# A release, announced on Discord: an embed with the version, its notes (the tag's
# message, docs/git.md) and the downloads, posted to the webhook in the repository's
# DISCORD_RELEASE_WEBHOOK secret. The message is made by discord-notify.jq, which
# `gh release view --jq` runs, so it can be tried locally the same way:
#
#   gh release view v0.10.2 --json name,tagName,url,body,publishedAt,isPrerelease,assets \
#     --jq "$(cat .github/discord-notify.jq)"
#
# The release workflow calls this as its last job, once the release is published
# (release.yml), for a release and not a pre-release. It publishes with GITHUB_TOKEN, and
# GitHub starts no workflow on events that token causes, so its `release: published`
# comes to nothing here and the release is announced once. A release published by hand
# comes as `release`; and this can be run by hand with a tag, to post one again, with
# notes and a title of its own if given (an announcement of several releases at once):
#
#   gh workflow run discord-notify.yml -f tag=v0.10.3 -f title="..." -f notes="$(cat notes.md)"

name: discord notify

on:
  workflow_call:
    inputs:
      tag:
        description: "the release's tag, as v0.10.2"
        type: string
        required: true
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "the release's tag, as v0.10.2: its link and downloads"
        required: true
      title:
        description: "the embed's title, over the release's"
        required: false
      notes:
        description: "the notes, over the release's"
        required: false

jobs:
  announce:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github

      - name: the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          state=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          if [ "$state" = "true" ]; then
            echo "$TAG is still a draft: nothing to announce"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: announce
        if: steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          REPO_RAW: https://raw.githubusercontent.com/${{ github.repository }}/${{ steps.release.outputs.tag }}
          TITLE: ${{ github.event.inputs.title }}
          NOTES: ${{ github.event.inputs.notes }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::no DISCORD_RELEASE_WEBHOOK secret: $TAG is not announced"
            exit 0
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json name,tagName,url,body,publishedAt,isPrerelease,assets \
            --jq "$(cat .github/discord-notify.jq)" > message.json
          cat message.json
          curl --fail-with-body -sS -H "Content-Type: application/json" -d @message.json "$WEBHOOK"

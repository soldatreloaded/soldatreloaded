name: package
description: >
  One package of a release for the runner's platform, into build/dist/: the program,
  the part of assets/ it reads, its zip, and its manifest

# The game draws and plays mods/ and has no use for scripts/; the server plays by data/
# and runs scripts/, and draws nothing. So each package holds only what its program
# reads. Into build/dist/:
#
#   soldatreloaded-<version>-<platform>/                 the install, unpacked
#   soldatreloaded-<version>-<platform>.zip              what a player downloads
#   soldatreloaded-<version>-<platform>.manifest.json    every file in it, by hash
#
# and soldatreloaded-server-… for the server.

inputs:
  app:
    description: client or server
    required: true
  version:
    description: the release's version, as its tag (v0.1.0) or without the v
    required: true

runs:
  using: composite
  steps:
    - name: package
      shell: bash
      env:
        APP: ${{ inputs.app }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        VERSION="${VERSION#v}"
        case "$RUNNER_OS" in
          Windows) platform=windows; exe=.exe ;;
          Linux) platform=linux; exe= ;;
          *) echo "::error::no packages for $RUNNER_OS"; exit 1 ;;
        esac
        case "$APP" in
          client) name="soldatreloaded-$VERSION-$platform"; program="soldatreloaded$exe" ;;
          server) name="soldatreloaded-server-$VERSION-$platform"; program="soldatreloaded-server$exe" ;;
          *) echo "::error::app is client or server, not $APP"; exit 1 ;;
        esac
        dist=build/dist
        stage="$dist/$name"
        mkdir -p "$stage"

        # The program, built for speed. The game on Windows is a windowed program,
        # without a console of its own; the server is a console.
        flags=(-o:speed -vet)
        if [ "$APP" = client ] && [ "$platform" = windows ]; then flags+=(-subsystem:windows); fi
        odin build "apps/$APP" "${flags[@]}" -out:"$stage/$program"
        rm -f "$stage"/*.pdb "$stage"/*.exp "$stage"/*.lib

        # What of assets/ it reads.
        cp -r assets/data "$stage/"
        if [ "$APP" = client ]; then
          mkdir -p "$stage/mods"
          cp -r assets/mods/default "$stage/mods/"
        else
          cp -r assets/scripts "$stage/"
          # Lua is loaded late, from beside the server, on Windows; on Linux it is linked in.
          if [ "$platform" = windows ]; then cp "$(odin root)/vendor/lua/5.4/windows/lua54.dll" "$stage/"; fi
        fi
        cp license.md "$stage/"
        printf '%s\n' "$VERSION" > "$stage/version.txt"

        # The manifest: every file of the install by its path, size and SHA-256, sorted by
        # path, so the updater can tell what an install has from what the release ships.
        (
          cd "$stage"
          find . -type f -printf '%P\0' | LC_ALL=C sort -z > ../files.list
          tr '\0' '\n' < ../files.list > ../paths.list
          xargs -0 stat -c '%s' < ../files.list > ../sizes.list
          xargs -0 sha256sum -b < ../files.list | sed 's/ \*.*$//' > ../hashes.list
        )
        {
          printf '{\n'
          printf '  "name": "%s",\n' "${name%-"$VERSION"-"$platform"}"
          printf '  "version": "%s",\n' "$VERSION"
          printf '  "platform": "%s",\n' "$platform"
          printf '  "archive": "%s.zip",\n' "$name"
          printf '  "files": [\n'
          paste -d '\t' "$dist/paths.list" "$dist/sizes.list" "$dist/hashes.list" |
            awk -F '\t' '{
              gsub(/\\/, "\\\\", $1); gsub(/"/, "\\\"", $1)
              printf "%s    {\"path\": \"%s\", \"size\": %s, \"sha256\": \"%s\"}", (NR > 1 ? ",\n" : ""), $1, $2, $3
            } END { printf "\n" }'
          printf '  ]\n'
          printf '}\n'
        } > "$dist/$name.manifest.json"
        count=$(wc -l < "$dist/paths.list")
        rm -f "$dist"/*.list

        # The zip, its files at its root, as the install is laid out.
        (
          cd "$stage"
          if command -v zip > /dev/null; then zip -qr -9 "../$name.zip" .
          else 7z a -tzip -mx=9 -bso0 "../$name.zip" . > /dev/null
          fi
        )
        echo "$dist/$name.zip: $count files"
